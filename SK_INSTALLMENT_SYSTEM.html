<!DOCTYPE html><html lang="ta"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEW SK PHONE SHOP – தவணை மேலாண்மை</title><style>
*{box-sizing:border-box}body{margin:0;font:15px/1.5 "Noto Sans Tamil",Latha,"Segoe UI",Arial,sans-serif;background:#eef2f9;color:#12203a}
#s{position:fixed;inset:0 auto 0 0;width:240px;background:#0b2a5b;color:#fff;padding:12px;overflow:auto}#s h1{font-size:16px;margin:0 0 12px;text-align:center;letter-spacing:1px}
#s a{display:block;color:#cfdcf5;padding:9px 10px;border-radius:6px;cursor:pointer;font-size:14px}#s a.on,#s a:hover{background:#1b4fa8;color:#fff}
main{margin-left:240px;padding:18px}h2{margin:0 0 12px;color:#0b2a5b}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}.card{background:#fff;border-left:5px solid #1b4fa8;border-radius:8px;padding:12px;box-shadow:0 1px 3px #0002}.card b{display:block;font-size:20px;color:#0b2a5b}.card.w{border-color:#c0392b}
.tw{overflow-x:auto;background:#fff;border-radius:8px;box-shadow:0 1px 3px #0002}table{border-collapse:collapse;width:100%}th{background:#0b2a5b;color:#fff;text-align:left;padding:8px;font-size:13px;white-space:nowrap}td{padding:7px 8px;border-bottom:1px solid #e3e8f2;font-size:14px}
input,select,textarea{width:100%;padding:8px;border:1px solid #b9c5dc;border-radius:6px;font:inherit}label{display:block;font-size:13px;margin:6px 0;color:#34466b}
button{padding:8px 12px;border:1px solid #1b4fa8;background:#fff;color:#1b4fa8;border-radius:6px;cursor:pointer;font:inherit;margin:2px}button.p{background:#1b4fa8;color:#fff}button.d{border-color:#c0392b;color:#c0392b}
.ov{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px;z-index:9}.md{background:#fff;border-radius:10px;padding:18px;width:min(720px,100%)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 12px}.r{text-align:right;margin-top:10px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.bar input,.bar select{flex:1;min-width:160px}
.b{padding:2px 8px;border-radius:10px;font-size:12px;color:#fff}.Paid{background:#1e8e4e}.Unpaid{background:#7a869a}.Partial{background:#d68910}.Overdue{background:#c0392b}
.ph{width:64px;height:64px;border-radius:50%;object-fit:cover;background:#cfd8ea}.lg{max-width:360px;margin:8vh auto;background:#fff;padding:24px;border-radius:12px;border-top:6px solid #0b2a5b}
@media(max-width:800px){#s{position:static;width:auto;display:flex;overflow-x:auto;gap:4px}#s h1{display:none}#s a{white-space:nowrap}main{margin:0;padding:10px}}
</style></head><body><div id="app"></div><div id="m"></div><script>
const $=i=>document.getElementById(i),V=i=>$(i).value.trim(),r2=n=>Math.round((+n+Number.EPSILON)*100)/100;
const f=n=>'Rs. '+r2(n).toLocaleString('en-US',{minimumFractionDigits:2}),e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const td=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10),pad=(n,l)=>String(n).padStart(l,'0');
let D,ME,view='dash',sel=null,q='',sf='',after=null,rv={t:'daily',a:td(),b:td()},IM=null,RP=null;
/* ---- storage ---- */
const idb=()=>new Promise((r,j)=>{const x=indexedDB.open('sk_installment',1);x.onupgradeneeded=()=>x.result.createObjectStore('kv');x.onsuccess=()=>r(x.result);x.onerror=()=>j(x.error)});
async function load(){const db=await idb();return new Promise(r=>{const g=db.transaction('kv').objectStore('kv').get('d');g.onsuccess=()=>r(g.result)})}
async function save(){const db=await idb();return new Promise((r,j)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(D,'d');t.oncomplete=r;t.onerror=()=>j(t.error)})}
const log=(a,d)=>D.log.unshift({t:new Date().toISOString(),u:ME?ME.name:'-',a,d});
/* ---- security ---- */
const rs=()=>btoa(String.fromCharCode(...crypto.getRandomValues(new Uint8Array(16))));
async function hash(pw,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:Uint8Array.from(atob(salt),c=>c.charCodeAt(0)),iterations:150000,hash:'SHA-256'},k,256);return btoa(String.fromCharCode(...new Uint8Array(b)))}
function setupScr(){$('app').innerHTML=`<div class=lg><h2>NEW SK PHONE SHOP</h2><p>முதல் முறை: Admin கடவுச்சொல் உருவாக்குக</p><label>பயனர் பெயர்<input id=u value=admin></label><label>கடவுச்சொல் (6+)<input id=p type=password></label><label>மீண்டும்<input id=p2 type=password></label><button class=p onclick="mkAdmin()">உருவாக்கு</button></div>`}
async function mkAdmin(){if(!crypto.subtle)return alert('Chrome/Edge பயன்படுத்தவும்');const u=V('u'),p=$('p').value;if(!u||p.length<6||p!==$('p2').value)return alert('கடவுச்சொல் பொருந்தவில்லை / குறைவு');const s=rs();D={v:1,users:[{name:u,role:'admin',salt:s,h:await hash(p,s)}],cust:[],ph:[],pay:[],log:[],seq:{c:0,p:0,r:0}};await save();loginScr()}
function loginScr(){$('app').innerHTML=`<div class=lg><h2>NEW SK PHONE SHOP</h2><p>தவணை மேலாண்மை – உள்நுழைவு</p><label>பயனர்<input id=u></label><label>கடவுச்சொல்<input id=p type=password onkeydown="if(event.key=='Enter')login()"></label><button class=p onclick="login()">உள்நுழை</button></div>`}
async function login(){const u=D.users.find(x=>x.name===V('u'));if(!u||await hash($('p').value,u.salt)!==u.h)return alert('பயனர்/கடவுச்சொல் தவறு');ME={name:u.name,role:u.role};log('உள்நுழைவு','');await save();view='dash';render()}
function logout(){ME=null;loginScr()}
/* ---- calculations ---- */
const cu=id=>D.cust.find(c=>c.id===id),phs=c=>D.ph.filter(p=>p.cid===c),pays=p=>D.pay.filter(x=>x.pid===p&&!x.void);
const paid=p=>r2(pays(p.id).reduce((a,x)=>a+x.amt,0)),fin=p=>r2(p.price-p.adv),bal=p=>r2(fin(p)-paid(p));
function expd(p){const s=new Date(p.start),n=new Date(td());let m=(n.getFullYear()-s.getFullYear())*12+n.getMonth()-s.getMonth()+(n.getDate()>=s.getDate()?1:0);m=Math.max(0,Math.min(m,p.dur));return Math.min(fin(p),r2(m*p.mon))}
const od=p=>bal(p)>.005?Math.max(0,r2(expd(p)-paid(p))):0,st=p=>bal(p)<=.005?'Paid':od(p)>.005?'Overdue':paid(p)>0?'Partial':'Unpaid';
const stT={Paid:'செலுத்தியது',Unpaid:'செலுத்தாதது',Partial:'பகுதி',Overdue:'தாமதம்'},badge=p=>`<span class="b ${st(p)}">${stT[st(p)]}</span>`;
/* ---- shell ---- */
const NAV=[['dash','📊 முகப்பு Dashboard'],['cust','👥 வாடிக்கையாளர் Customers'],['acc','📱 தவணைக் கணக்குகள் Accounts'],['rep','📑 அறிக்கைகள் Reports'],['imp','⇄ இறக்குமதி/ஏற்றுமதி Import-Export',1],['bk','💾 காப்புப்பிரதி Backup',1],['usr','🔑 பயனர்கள் Users',1],['aud','🧾 தணிக்கை Audit',1]];
const go=v=>{view=v;render()},opn=id=>{sel=id;go('cd')},cls=()=>{$('m').innerHTML=''},modal=h=>$('m').innerHTML=`<div class=ov><div class=md>${h}</div></div>`;
function render(){if(!ME)return;const A=ME.role=='admin';$('app').innerHTML=`<div id=s><h1>NEW SK<br>PHONE SHOP</h1>${NAV.filter(n=>!n[2]||A).map(n=>`<a class="${view==n[0]||view=='cd'&&n[0]=='cust'?'on':''}" onclick="go('${n[0]}')">${n[1]}</a>`).join('')}<a onclick="logout()">🚪 வெளியேறு (${e(ME.name)})</a></div><main>${VW[view]()}</main>`;if(after){after();after=null}}
const adm=()=>ME.role=='admin';
/* ---- views ---- */
const VW={dash(){const P=D.ph,pay=D.pay.filter(x=>!x.void),sum=(a,k)=>r2(a.reduce((s,x)=>s+k(x),0)),od1=P.filter(p=>od(p)>0);
const lb=D.lastBk?Math.floor((Date.now()-D.lastBk)/864e5):null,warn=lb===null||lb>=7?`<p class=card style="border-color:#d68910">⚠ காப்புப்பிரதி ${lb===null?'எடுக்கவில்லை':lb+' நாட்களுக்கு முன்'} – Backup பக்கத்தில் JSON பதிவிறக்கவும்.</p>`:'';
const C=(t,v,w)=>`<div class="card ${w?'w':''}">${t}<b>${v}</b></div>`;
return`<h2>முகப்பு / Dashboard</h2>${warn}<div class=cards>${C('மொத்த வாடிக்கையாளர்',D.cust.length)}${C('தவணையில் விற்ற தொலைபேசிகள்',P.length)}${C('மொத்த விற்பனை',f(sum(P,p=>p.price)))}${C('முன்பணம்',f(sum(P,p=>p.adv)))}${C('தவணை வசூல்',f(sum(pay,x=>x.amt)))}${C('மொத்த நிலுவை',f(sum(P,bal)),1)}${C('இன்றைய வசூல்',f(sum(pay.filter(x=>x.date==td()),x=>x.amt)))}${C('தாமத தவணைகள்',od1.length+' ('+f(sum(od1,od))+')',1)}</div>`},
cust(){after=lst;return`<h2>வாடிக்கையாளர்கள்</h2><div class=bar><input id=q placeholder="தேடு: பெயர்/கைப்பேசி/NIC/ID/மாடல்/IMEI" value="${e(q)}" oninput="q=this.value;lst()"><button class=p onclick="cForm()">+ புதிய</button></div><div class=tw id=L></div>`},
acc(){after=lst;return`<h2>தவணைக் கணக்குகள்</h2><div class=bar><input id=q placeholder="தேடு: பெயர்/கைப்பேசி/NIC/ID/மாடல்/IMEI" value="${e(q)}" oninput="q=this.value;lst()"><select id=sf onchange="sf=this.value;lst()"><option value="">அனைத்தும்${['Paid','Unpaid','Partial','Overdue'].map(s=>`<option value=${s} ${sf==s?'selected':''}>${stT[s]} / ${s}`).join('')}</select></div><div class=tw id=L></div>`},
cd(){const c=cu(sel);if(!c)return go('cust'),'';const P=phs(c.id),A=adm();return`<h2>${e(c.name)} <small>(${c.id})</small></h2><div class=card style="display:flex;gap:14px;align-items:center;margin-bottom:12px">${c.photo?`<img class=ph src="${c.photo}">`:'<div class=ph></div>'}<div>📞 ${e(c.mob)} · NIC ${e(c.nic)||'-'}<br>📍 ${e(c.addr)||'-'}<br>பதிவு: ${e(c.reg)} ${c.notes?'<br>📝 '+e(c.notes):''}</div></div><div class=bar><button class=p onclick="pForm('${c.id}')">+ தொலைபேசி</button>${A?`<button onclick="cForm('${c.id}')">திருத்து</button><button class=d onclick="cDel('${c.id}')">நீக்கு</button>`:''}<button onclick="go('cust')">← பின்</button></div><div class=tw><table><tr><th>மாடல்<th>IMEI<th>விலை<th>முன்பணம்<th>மாதத்தவணை<th>தொடக்கம்/மாதங்கள்<th>செலுத்தியது<th>மீதி<th>தாமதம்<th>நிலை<th></tr>${P.map(p=>`<tr><td>${e(p.model)}<td>${e(p.imei)}<td>${f(p.price)}<td>${f(p.adv)}<td>${f(p.mon)}<td>${p.start}<br>${p.dur} மா. (மாதம் ${+p.start.slice(8)}ம் தேதி)<td>${f(paid(p))}<td><b>${f(bal(p))}</b><td>${f(od(p))}<td>${badge(p)}<td style="white-space:nowrap"><button class=p onclick="yForm('${p.id}')">கட்டணம்</button><button onclick="hist('${p.id}')">வரலாறு</button>${A?`<button onclick="pForm('${c.id}','${p.id}')">✎</button><button class=d onclick="pDel('${p.id}')">🗑</button>`:''}`).join('')||'<tr><td colspan=11>தொலைபேசி இல்லை'}</table></div>`},
rep(){const R=RP=repData(rv.t,rv.a,rv.b),o=[['daily','தினசரி வசூல்'],['monthly','மாதாந்திர வசூல்'],['cout','வாடிக்கையாளர் நிலுவை'],['pout','தொலைபேசி வாரி நிலுவை'],['over','தாமத தவணைகள்'],['paidc','முழுவதும் செலுத்தியோர்'],['sales','மொத்த விற்பனை'],['prof','இலாபம் (கொள்முதல் விலை உள்ளவை)']];
return`<h2>அறிக்கைகள்</h2><div class=bar><select onchange="rv.t=this.value;render()">${o.map(x=>`<option value=${x[0]} ${rv.t==x[0]?'selected':''}>${x[1]}`).join('')}</select><input type=date value=${rv.a} onchange="rv.a=this.value;render()"><input type=date value=${rv.b} onchange="rv.b=this.value;render()"><button onclick="dl('report.csv',csv(RP.h,RP.r))">CSV</button><button class=p onclick="pwin(RP)">PDF / அச்சு</button></div><div class=tw>${tbl(R)}</div>`},
imp(){return`<h2>இறக்குமதி / ஏற்றுமதி</h2><div class=card><b>CSV ஏற்றுமதி</b><button onclick="expAll()">அனைத்து கணக்குகள் CSV</button><button onclick="expPay()">கட்டணங்கள் CSV</button><button onclick="dl('import_template.csv',csv(COLS,[]))">வெற்று டெம்ப்ளேட்</button></div><br><div class=card><b>CSV இறக்குமதி</b><small>Excel-இல் File → Save As → CSV UTF-8. ஒரு வரிசை = ஒரு தொலைபேசி (ஒரே வாடிக்கையாளருக்கு பல வரிசைகள்).</small><input type=file accept=.csv onchange="rdCSV(this.files[0])"><label>CSV உரை (இங்கே திருத்தலாம்)<textarea id=ct rows=8 style="font-family:monospace">${e(IM?IM.text:'')}</textarea></label><button class=p onclick="chkCSV()">சரிபார்</button><div id=ir>${IM?imRes():''}</div></div>`},
bk(){return`<h2>காப்புப்பிரதி / Restore</h2><div class=card><button class=p onclick="backup()">JSON காப்புப்பிரதி பதிவிறக்கு</button><p>புகைப்படங்கள், கட்டண வரலாறு அனைத்தும் உள்ளடங்கும்.</p></div><br><div class=card><b>மீட்டெடு</b><input type=file accept=.json onchange="restore(this.files[0])"></div>`},
usr(){return`<h2>பயனர்கள்</h2><div class=tw><table><tr><th>பெயர்<th>பங்கு<th></tr>${D.users.map(u=>`<tr><td>${e(u.name)}<td>${u.role}<td><button onclick="uPw('${e(u.name)}')">கடவுச்சொல் மாற்று</button>${u.name!=ME.name?`<button class=d onclick="uDel('${e(u.name)}')">நீக்கு</button>`:''}`).join('')}</table></div><br><div class=card><b>புதிய பயனர்</b><div class=g><label>பெயர்<input id=un></label><label>கடவுச்சொல்<input id=up type=password></label><label>பங்கு<select id=ur><option value=cashier>Cashier<option value=admin>Admin</select></label></div><button class=p onclick="uAdd()">சேர்</button></div>`},
aud(){return`<h2>தணிக்கை பதிவு (கடைசி 400)</h2><div class=tw><table><tr><th>நேரம்<th>பயனர்<th>செயல்<th>விவரம்</tr>${D.log.slice(0,400).map(l=>`<tr><td>${l.t.replace('T',' ').slice(0,19)}<td>${e(l.u)}<td>${e(l.a)}<td>${e(l.d)}`).join('')}</table></div>`}};
/* ---- lists ---- */
const mt=(c,s)=>{s=s.toLowerCase();return!s||[c.id,c.name,c.mob,c.nic].some(x=>(x||'').toLowerCase().includes(s))||phs(c.id).some(p=>(p.model+' '+p.imei+' '+p.serial).toLowerCase().includes(s))};
function lst(){const L=$('L');if(!L)return;if(view=='cust')L.innerHTML=`<table><tr><th>ID<th><th>பெயர்<th>கைப்பேசி<th>NIC<th>தொ.பே.<th>நிலுவை<th></tr>${D.cust.filter(c=>mt(c,q)).map(c=>`<tr><td>${c.id}<td>${c.photo?`<img class=ph style="width:32px;height:32px" src="${c.photo}">`:''}<td>${e(c.name)}<td>${e(c.mob)}<td>${e(c.nic)}<td>${phs(c.id).length}<td>${f(phs(c.id).reduce((a,p)=>a+bal(p),0))}<td><button class=p onclick="opn('${c.id}')">திற</button>`).join('')}</table>`;
else{const s=q.toLowerCase();L.innerHTML=`<table><tr><th>வாடிக்கையாளர்<th>மாடல்<th>IMEI<th>விலை<th>செலுத்தியது<th>மீதி<th>நிலை<th></tr>${D.ph.filter(p=>{const c=cu(p.cid);return(!sf||st(p)==sf)&&(!s||mt(c,s)&&([c.id,c.name,c.mob,c.nic].some(x=>(x||'').toLowerCase().includes(s))||(p.model+' '+p.imei+' '+p.serial).toLowerCase().includes(s)))}).map(p=>`<tr><td>${e(cu(p.cid).name)}<td>${e(p.model)}<td>${e(p.imei)}<td>${f(p.price)}<td>${f(paid(p))}<td>${f(bal(p))}<td>${badge(p)}<td style="white-space:nowrap"><button class=p onclick="yForm('${p.id}')">கட்டணம்</button><button onclick="opn('${p.cid}')">விவரம்</button>`).join('')}</table>`}}
/* ---- customer ---- */

if(COLS.slice(0,2).some(k=>!H.includes(k))){err.push({row:1,msg:'தலைப்பு வரிசை தவறு – டெம்ப்ளேட் பயன்படுத்தவும்'})}else R.slice(1).forEach((l,i)=>{const o={};COLS.forEach(k=>o[k]=(l[H.indexOf(k)]||'').trim());const row=i+2,E=m=>err.push({row,msg:m+' ('+o.name+')'});
if(!o.name)return E('பெயர் இல்லை');if(!/^[0-9+ ]{9,14}$/.test(o.mobile))return E('கைப்பேசி தவறு');o.reg_date=o.reg_date||td();if(!okD(o.reg_date))return E('reg_date தவறு');
if(o.model||o.imei){if(!o.model)return E('model இல்லை');if(!/^\d{14,16}$/.test(o.imei))return E('IMEI தவறு');if(D.ph.some(p=>p.imei===o.imei)||seen.has(o.imei))return E('IMEI நகல்: '+o.imei);const pr=r2(o.price),av=r2(o.advance||0),mo=r2(o.monthly),du=parseInt(o.duration);if(!(pr>0)||av<0||av>pr)return E('விலை/முன்பணம் தவறு');if(!(mo>0)||!(du>=1))return E('monthly/duration தவறு');o.purchase_date=o.purchase_date||o.start_date;if(!okD(o.purchase_date)||!okD(o.start_date))return E('திகதி தவறு (YYYY-MM-DD)');seen.add(o.imei);o._p={model:o.model,imei:o.imei,serial:o.serial,pdate:o.purchase_date,price:pr,adv:av,cost:r2(o.cost||0),dur:du,mon:mo,start:o.start_date,notes:o.phone_notes}}ok.push(o)});render()}
const imRes=()=>!IM.ok?'':`<p><b>சரி: ${IM.ok.length} வரிசை · பிழை: ${IM.err.length}</b></p>${IM.err.length?`<div class=tw><table><tr><th>வரிசை<th>பிழை</tr>${IM.err.map(x=>`<tr><td>${x.row}<td>${e(x.msg)}`).join('')}</table></div><small>மேலே உரையில் திருத்தி மீண்டும் "சரிபார்" அழுத்தவும்.</small>`:''}${IM.ok.length?`<button class=p onclick="doImp()">சரியான ${IM.ok.length} வரிசைகளை இறக்கு</button>`:''}`;
async function doImp(){if(!confirm(IM.ok.length+' வரிசைகள் சேர்க்கப்படும் (ஏற்கனவே உள்ளவை மாற்றப்படாது). தொடரவா?'))return;let nc=0,np=0;IM.ok.forEach(o=>{let c=D.cust.find(x=>o.nic&&x.nic===o.nic.toUpperCase()||x.mob===o.mobile);if(!c){D.cust.push(c={id:'C'+pad(++D.seq.c,4),name:o.name,mob:o.mobile,nic:o.nic.toUpperCase(),addr:o.address,reg:o.reg_date,notes:o.notes});nc++}if(o._p){D.ph.push({id:'P'+pad(++D.seq.p,4),cid:c.id,...o._p});np++}});log('இறக்குமதி',nc+' வாடிக்கையாளர், '+np+' தொலைபேசி');await save();alert('புதிய வாடிக்கையாளர்: '+nc+'\nதொலைபேசிகள்: '+np);IM=null;render()}
/* ---- backup ---- */
function backup(){dl('SK_backup_'+td()+'.json',JSON.stringify(D),'application/json');D.lastBk=Date.now();log('காப்புப்பிரதி','');save()}
function chkBk(o){const A=['users','cust','ph','pay','log'];if(!o||A.some(k=>!Array.isArray(o[k]))||!o.seq||!o.users.some(u=>u.role=='admin'&&u.h&&u.salt))return'கோப்பு வடிவம் தவறு';const C=new Set(o.cust.map(c=>c.id)),P=new Set(o.ph.map(p=>p.id));if(o.cust.some(c=>!c.id||!c.name))return'வாடிக்கையாளர் தரவு தவறு';if(o.ph.some(p=>!C.has(p.cid)||!(p.price>0)))return'தொலைபேசி தரவு தவறு';if(o.pay.some(y=>!P.has(y.pid)||!(y.amt>0)))return'கட்டண தரவு தவறு';return''}
async function restore(fl){if(!fl)return;let o;try{o=JSON.parse(await fl.text())}catch{return alert('JSON படிக்க முடியவில்லை')}const m=chkBk(o);if(m)return alert('✖ '+m);if(!confirm(`சரிபார்க்கப்பட்டது: ${o.cust.length} வாடிக்கையாளர், ${o.ph.length} தொலைபேசி, ${o.pay.length} கட்டணம்.\nஇப்போதைய தரவு மாற்றப்படும்! முதலில் தற்போதைய தரவின் காப்புப்பிரதி தானாக பதிவிறக்கப்படும். தொடரவா?`))return;backup();D=o;ME=null;await save();alert('மீட்டெடுக்கப்பட்டது. மீண்டும் உள்நுழையவும்.');loginScr()}
/* ---- users ---- */
async function uAdd(){const n=V('un'),p=$('up').value;if(!n||p.length<6||D.users.some(u=>u.name===n))return alert('பெயர் நகல்/கடவுச்சொல் 6+ தேவை');const s=rs();D.users.push({name:n,role:V('ur'),salt:s,h:await hash(p,s)});log('பயனர் சேர்ப்பு',n);await save();render()}
async function uPw(n){const p=prompt('புதிய கடவுச்சொல் (6+)');if(!p||p.length<6)return;const u=D.users.find(x=>x.name===n);u.salt=rs();u.h=await hash(p,u.salt);log('கடவுச்சொல் மாற்றம்',n);await save();alert('மாற்றப்பட்டது')}
async function uDel(n){if(!confirm(n+' நீக்கவா?'))return;D.users=D.users.filter(u=>u.name!==n);log('பயனர் நீக்கம்',n);await save();render()}
/* ---- boot ---- */
(async()=>{navigator.storage?.persist?.();try{D=await load()}catch(x){return $('app').innerHTML='<div class=lg>Browser storage பிழை. Chrome/Edge பயன்படுத்தவும்.</div>'}D?loginScr():setupScr()})();
</script></body></html>
