<!DOCTYPE html><html lang="ta"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEW SK PHONE SHOP – தவணை (Cloud)</title><style>
*{box-sizing:border-box}body{margin:0;font:15px/1.5 "Noto Sans Tamil",Latha,"Segoe UI",Arial,sans-serif;background:#eef2f9;color:#12203a}
#s{position:fixed;inset:0 auto 0 0;width:240px;background:#000;color:#fff;padding:12px;overflow:auto}.lgo{width:100%;border-radius:8px;margin-bottom:8px}
#s a{display:block;color:#e8d9a0;padding:9px 10px;border-radius:6px;cursor:pointer;font-size:14px}#s a.on,#s a:hover{background:#f5c518;color:#000}
main{margin-left:240px;padding:18px}h2{margin:0 0 12px;color:#111;border-bottom:3px solid #f5c518;display:inline-block}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}.card{background:#fff;border-left:5px solid #f5c518;border-radius:8px;padding:12px;box-shadow:0 1px 3px #0002}.card b{display:block;font-size:20px;color:#111}.card.w{border-color:#c0392b}
.tw{overflow-x:auto;background:#fff;border-radius:8px;box-shadow:0 1px 3px #0002}table{border-collapse:collapse;width:100%}th{background:#111;color:#f5c518;text-align:left;padding:8px;font-size:13px;white-space:nowrap}td{padding:7px 8px;border-bottom:1px solid #e3e8f2;font-size:14px}
input,select,textarea{width:100%;padding:8px;border:1px solid #b9c5dc;border-radius:6px;font:inherit}label{display:block;font-size:13px;margin:6px 0;color:#34466b}
button{padding:8px 12px;border:1px solid #111;background:#fff;color:#111;border-radius:6px;cursor:pointer;font:inherit;margin:2px}button.p{background:#f5c518;color:#000;border-color:#c9a000;font-weight:bold}button.d{border-color:#c0392b;color:#c0392b}
.ov{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px;z-index:9}.md{background:#fff;border-radius:10px;padding:18px;width:min(720px,100%)}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 12px}.r{text-align:right;margin-top:10px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.bar input,.bar select{flex:1;min-width:160px}
.b{padding:2px 8px;border-radius:10px;font-size:12px;color:#fff}.Paid{background:#1e8e4e}.Unpaid{background:#7a869a}.Partial{background:#d68910}.Overdue{background:#c0392b}
.ph{width:64px;height:64px;border-radius:50%;object-fit:cover;background:#cfd8ea}.lg{max-width:360px;margin:8vh auto;background:#fff;padding:24px;border-radius:12px;border-top:6px solid #f5c518}
@media(max-width:800px){#s{position:static;width:auto;display:flex;overflow-x:auto;gap:4px}.lgo{display:none}#s a{white-space:nowrap}main{margin:0;padding:10px}}

function parseCSV(t){t=t.replace(/^\ufeff/,'');const R=[];let r=[],v='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){v+='"';i++}else q=false}else v+=c}else if(c=='"')q=true;else if(c==',')(r.push(v),v='');else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(v);v='';R.push(r);r=[]}else v+=c}if(v||r.length){r.push(v);R.push(r)}return R.filter(r=>r.some(x=>x.trim()))}
const okD=s=>/^\d{4}-\d{2}-\d{2}$/.test(s)&&!isNaN(new Date(s));
async function rdCSV(fl){if(!fl)return;IM={text:await fl.text()};render()}
function chkCSV(){const R=parseCSV($('ct').value),H=(R[0]||[]).map(x=>x.trim().toLowerCase()),err=[],ok=[],seen=new Set();IM={text:$('ct').value,err,ok};
if(COLS.slice(0,2).some(k=>!H.includes(k))){err.push({row:1,msg:'தலைப்பு வரிசை தவறு – டெம்ப்ளேட் பயன்படுத்தவும்'})}else R.slice(1).forEach((l,i)=>{const o={};COLS.forEach(k=>o[k]=(l[H.indexOf(k)]||'').trim());const row=i+2,E=m=>err.push({row,msg:m+' ('+o.name+')'});
if(!o.name)return E('பெயர் இல்லை');if(!/^[0-9+ ]{9,14}$/.test(o.mobile))return E('கைப்பேசி தவறு');o.reg_date=o.reg_date||td();if(!okD(o.reg_date))return E('reg_date தவறு');
if(o.model||o.imei){if(!o.model)return E('model இல்லை');if(!/^\d{14,16}$/.test(o.imei))return E('IMEI தவறு');if(D.ph.some(p=>p.imei===o.imei)||seen.has(o.imei))return E('IMEI நகல்: '+o.imei);const pr=r2(o.price),av=r2(o.advance||0),mo=r2(o.monthly),du=parseInt(o.duration);if(!(pr>0)||av<0||av>pr)return E('விலை/முன்பணம் தவறு');if(!(mo>0)||!(du>=1))return E('monthly/duration தவறு');o.purchase_date=o.purchase_date||o.start_date;if(!okD(o.purchase_date)||!okD(o.start_date))return E('திகதி தவறு (YYYY-MM-DD)');seen.add(o.imei);o._p={model:o.model,imei:o.imei,serial:o.serial,pdate:o.purchase_date,price:pr,adv:av,cost:r2(o.cost||0),dur:du,mon:mo,start:o.start_date,notes:o.phone_notes}}ok.push(o)});render()}
const imRes=()=>!IM.ok?'':`<p><b>சரி: ${IM.ok.length} வரிசை · பிழை: ${IM.err.length}</b></p>${IM.err.length?`<div class=tw><table><tr><th>வரிசை<th>பிழை</tr>${IM.err.map(x=>`<tr><td>${x.row}<td>${e(x.msg)}`).join('')}</table></div><small>மேலே உரையில் திருத்தி மீண்டும் "சரிபார்" அழுத்தவும்.</small>`:''}${IM.ok.length?`<button class=p onclick="doImp()">சரியான ${IM.ok.length} வரிசைகளை இறக்கு</button>`:''}`;
async function doImp(){if(!navigator.onLine)return alert('இணையம் தேவை');if(!confirm(IM.ok.length+' வரிசைகள் சேர்க்கப்படும் (ஏற்கனவே உள்ளவை மாற்றப்படாது). தொடரவா?'))return;try{const nw=[],U=o=>o.nic&&o.nic.toUpperCase();const find=o=>nw.find(x=>U(o)&&x.nic===U(o)||x.mob===o.mobile)||D.cust.find(x=>U(o)&&x.nic===U(o)||x.mob===o.mobile);
const plan=IM.ok.map(o=>{let c=find(o);if(!c){c={name:o.name,mob:o.mobile,nic:U(o)||'',addr:o.address,reg:o.reg_date,notes:o.notes};nw.push(c)}return[c,o._p]});
const c0=await reserve('c',nw.length),p0=await reserve('p',plan.filter(x=>x[1]).length);nw.forEach((c,i)=>c.id='C'+pad(c0+i+1,4));let k=0;const docs=nw.map(c=>['cust',c]);plan.forEach(([c,p])=>{if(p)docs.push(['ph',{id:'P'+pad(p0+ ++k,4),cid:c.id,...p}])});
for(let i=0;i<docs.length;i+=400){const b=FB.writeBatch(FB.db);docs.slice(i,i+400).forEach(([cn,o])=>b.set(FB.doc(FB.db,cn,o.id),o));await b.commit()}
log('இறக்குமதி',nw.length+' வாடிக்கையாளர், '+k+' தொலைபேசி');alert('புதிய வாடிக்கையாளர்: '+nw.length+'\nதொலைபேசிகள்: '+k);IM=null;render()}catch(x){alert('பிழை: '+(x.code||x.message))}}
/* ---- backup ---- */
function backup(){dl('SK_backup_'+td()+'.json',JSON.stringify({v:2,cust:D.cust,ph:D.ph,pay:D.pay,log:D.log}),'application/json');localStorage.setItem('lastBk',Date.now());log('காப்புப்பிரதி','')}
function chkBk(o){if(!o||!Array.isArray(o.cust)||!Array.isArray(o.ph)||!Array.isArray(o.pay))return'கோப்பு வடிவம் தவறு';const C=new Set(o.cust.map(c=>c.id)),P=new Set(o.ph.map(p=>p.id));if(o.cust.some(c=>!c.id||!c.name))return'வாடிக்கையாளர் தரவு தவறு';if(o.ph.some(p=>!p.id||!C.has(p.cid)||!(p.price>0)))return'தொலைபேசி தரவு தவறு';if(o.pay.some(y=>!y.id||!P.has(y.pid)||!(y.amt>0)))return'கட்டண தரவு தவறு';return''}
async function restore(fl){if(!fl)return;if(!navigator.onLine)return alert('இணையம் தேவை');let o;try{o=JSON.parse(await fl.text())}catch{return alert('JSON படிக்க முடியவில்லை')}const m=chkBk(o);if(m)return alert('✖ '+m);
const nc=o.cust.filter(c=>!cu(c.id)),np=o.ph.filter(p=>!D.ph.some(x=>x.id===p.id||x.imei===p.imei)),ny=o.pay.filter(y=>!D.pay.some(x=>x.id===y.id)&&np.concat(D.ph).some(p=>p.id===y.pid));
if(!confirm(`சரிபார்க்கப்பட்டது.\nசேர்க்கப்படும்: ${nc.length} வாடிக்கையாளர், ${np.length} தொலைபேசி, ${ny.length} கட்டணம்.\nஏற்கனவே உள்ள பதிவுகள் மாற்றப்படாது. தொடரவா?`))return;
try{const docs=[...nc.map(x=>['cust',x]),...np.map(x=>['ph',x]),...ny.map(x=>['pay',x])];for(let i=0;i<docs.length;i+=400){const b=FB.writeBatch(FB.db);docs.slice(i,i+400).forEach(([cn,x])=>b.set(FB.doc(FB.db,cn,x.id),x));await b.commit()}
const mx=(a,k)=>Math.max(0,...a.map(x=>parseInt(String(x[k]).replace(/\D/g,''))||0));await FB.runTransaction(FB.db,async tx=>{const r=FB.doc(FB.db,'meta','seq'),s=await tx.get(r),d=s.exists()?s.data():{};tx.set(r,{c:Math.max(d.c||0,mx(o.cust,'id')),p:Math.max(d.p||0,mx(o.ph,'id')),r:Math.max(d.r||0,mx(o.pay,'seq'))},{merge:true})});log('மீட்பு',nc.length+'/'+np.length+'/'+ny.length);alert('மீட்டெடுக்கப்பட்டது');render()}catch(x){alert('பிழை: '+(x.code||x.message))}}
/* ---- users ---- */
async function uAdd(){const n=V('un'),p=$('up').value;if(!n||p.length<6||D.users.some(u=>u.name.toLowerCase()===n.toLowerCase()))return alert('பெயர் நகல் / கடவுச்சொல் 6+ தேவை');const a2=FB.initializeApp(FB.cfg,'s'+Date.now()),au=FB.getAuth(a2);try{const c=await FB.createUserWithEmailAndPassword(au,E(n),p);await FB.signOut(au);up('users',{id:c.user.uid,name:n,role:V('ur'),active:true});log('பயனர் சேர்ப்பு',n);alert('பயனர் உருவாக்கப்பட்டது')}catch(x){alert(x.code=='auth/email-already-in-use'?'இந்தப் பெயர் ஏற்கனவே உள்ளது':x.code||x.message)}}
async function uPw(){const p=prompt('புதிய கடவுச்சொல் (6+)');if(!p||p.length<6)return;try{await FB.updatePassword(FB.auth.currentUser,p);alert('மாற்றப்பட்டது')}catch(x){alert(x.code=='auth/requires-recent-login'?'வெளியேறி மீண்டும் உள்நுழைந்து முயற்சிக்கவும்':x.code)}}
function uTog(id){const u=D.users.find(x=>x.id===id);up('users',{...u,active:u.active===false});log('பயனர் நிலை மாற்றம்',u.name);render()}
